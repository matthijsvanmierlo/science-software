<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemCanvas Studio</title>

    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <!-- Bootstrap Icons 1.11.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Kekule.js CSS -->
    <link href="https://cdn.jsdelivr.net/npm/kekule@0.9.3/dist/themes/default/kekule.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="css/studio.css" rel="stylesheet">

    <!-- External Dependencies via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/kekule@0.9.3/dist/kekule.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><i class="bi bi-bezier2"></i> ChemCanvas Studio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Studio</a></li>
                    <li class="nav-item"><a class="nav-link" href="data-lab.html">Data Lab</a></li>
                    <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="docs.html">Docs</a></li>
                </ul>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-light btn-sm" id="btn-export-svg">Export SVG</button>
                    <button class="btn btn-outline-light btn-sm" id="btn-export-png">Export PNG</button>
                    <button class="btn btn-outline-light btn-sm" id="btn-export-pdf">Export PDF</button>
                    <button class="btn btn-secondary btn-sm" id="btn-toggle-theme" aria-label="Toggle dark mode"><i class="bi bi-moon"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid d-flex p-0 studio-container">
        <!-- Sidebar Toolbar -->
        <aside class="sidebar bg-light border-end p-3 d-flex flex-column gap-3" style="width: 250px; overflow-y: auto;">
            <h5>Tools</h5>
            <div class="mb-2">
                <input type="text" class="form-control form-control-sm" id="graphics-search" placeholder="Search graphics..." aria-label="Search graphics library">
            </div>
            <div class="btn-group-vertical w-100" id="graphics-list">
                <!-- Dynamically populated from GlasswareLibrary catalog -->
            </div>
            <hr>
            <button class="btn btn-outline-primary text-start w-100" id="btn-add-molecule"><i class="bi bi-hexagon"></i> Draw Molecule</button>

            <hr>

            <h5>Properties</h5>
            <div id="properties-panel">
                <p class="text-muted small">Select an object to edit properties.</p>
                <div id="dynamic-props" class="d-none">
                    <!-- Dynamically populated based on selected object type -->
                </div>
            </div>
        </aside>

        <!-- Main Canvas Area -->
        <main class="flex-grow-1 position-relative bg-secondary-subtle canvas-wrapper overflow-auto" id="canvas-wrapper">
            <canvas id="main-canvas"></canvas>
        </main>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

    <!-- Application Scripts -->
    <script src="js/storage.js" type="module"></script>
    <script src="js/exporter.js" type="module"></script>
    <script src="js/glassware-library.js" type="module"></script>
    <script src="js/chemical-engine.js" type="module"></script>
    <script src="js/sensor-bridge.js" type="module"></script>
    <script src="js/app.js" type="module"></script>

    <!-- Molecule Editor Modal -->
    <div class="modal fade" id="moleculeModal" tabindex="-1" aria-labelledby="moleculeModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="moleculeModalLabel">Draw Molecule</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="chem-composer" style="width: 100%; height: 500px;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="btn-insert-molecule">Insert into Canvas</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
