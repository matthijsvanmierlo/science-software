<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemCanvas Studio - Data Lab</title>

    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <!-- Bootstrap Icons 1.11.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="css/studio.css" rel="stylesheet">

    <!-- External Dependencies via CDN -->
    <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><i class="bi bi-bezier2"></i> ChemCanvas Studio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Studio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="data-lab.html">Data Lab</a></li>
                    <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="docs.html">Docs</a></li>
                </ul>
                <div class="d-flex gap-2">
                    <button class="btn btn-secondary btn-sm" id="btn-toggle-theme"><i class="bi bi-moon"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Data Lab</h2>
        <p class="text-muted">Connect your Web Bluetooth or Web Serial sensors here.</p>

        <div class="row">
            <div class="col-md-4">
                <div class="card mb-4">
                    <div class="card-header">
                        Sensor Connection
                    </div>
                    <div class="card-body">
                        <button class="btn btn-primary w-100 mb-2" id="btn-connect-bluetooth"><i class="bi bi-bluetooth"></i> Connect Bluetooth Sensor</button>
                        <button class="btn btn-secondary w-100 mb-2" id="btn-connect-serial"><i class="bi bi-usb-symbol"></i> Connect Serial Sensor</button>
                        <button class="btn btn-outline-info w-100" id="btn-mock-data">Generate Mock Data</button>

                        <hr>
                        <div id="sensor-status" class="alert alert-secondary mt-3">Status: Disconnected</div>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        Live Data Visualization
                    </div>
                    <div class="card-body">
                        <div id="plotly-chart" style="width:100%; height:400px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="js/sensor-bridge.js" type="module"></script>
</body>
</html>
